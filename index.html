<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sewa Alat Outdoor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-green-800 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">OutdoorRent</h1>
            <div>
                <button onclick="showPage('katalog')" class="px-4 py-2 hover:bg-green-700 rounded">Katalog</button>
                <button onclick="showPage('admin')" class="px-4 py-2 hover:bg-green-700 rounded border-l border-green-600">Admin</button>
            </div>
        </div>
    </nav>

    <!-- Halaman Katalog -->
    <section id="page-katalog" class="container mx-auto p-6">
        <h2 class="text-2xl font-bold mb-6 text-center">Pilihan Alat Pendakian</h2>
        <div id="katalog-list" class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <!-- Data akan dimuat di sini -->
        </div>
    </section>

    <!-- Halaman Admin -->
    <section id="page-admin" class="container mx-auto p-6 hidden">
        <h2 class="text-2xl font-bold mb-6">Panel Management</h2>
        
        <!-- Form Tambah Barang -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h3 class="font-bold mb-4">Tambah Barang Baru</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <input id="in-nama" type="text" placeholder="Nama Barang" class="border p-2 rounded">
                <input id="in-kategori" type="text" placeholder="Kategori" class="border p-2 rounded">
                <input id="in-harga" type="number" placeholder="Harga Sewa" class="border p-2 rounded">
                <input id="in-stok" type="number" placeholder="Stok Awal" class="border p-2 rounded">
                <input id="in-gambar" type="text" placeholder="URL Gambar" class="border p-2 rounded">
                <input id="in-desc" type="text" placeholder="Deskripsi" class="border p-2 rounded col-span-2 md:col-span-1">
                <button onclick="tambahBarang()" class="bg-green-600 text-white rounded p-2 hover:bg-green-700">Simpan Barang</button>
            </div>
        </div>

        <!-- Tabel Stok -->
        <div class="bg-white rounded-lg shadow-md overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="p-4">Nama Alat</th>
                        <th class="p-4">Stok</th>
                        <th class="p-4">Aksi</th>
                    </tr>
                </thead>
                <tbody id="admin-list">
                    <!-- List update stok di sini -->
                </tbody>
            </table>
        </div>
    </section>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzC3MR8AiBWKV4tHgHGwsvFB1gfRIX2oYIXEq4nP3pQJGZxhd2K5r-s9xHZlkles5PRbw/exec";

        // Navigasi Halaman
        function showPage(page) {
            document.getElementById('page-katalog').classList.toggle('hidden', page !== 'katalog');
            document.getElementById('page-admin').classList.toggle('hidden', page !== 'admin');
            muatData();
        }

        // Ambil Data
        async function muatData() {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            
            // Render Katalog
            const katalogDiv = document.getElementById('katalog-list');
            katalogDiv.innerHTML = data.map(item => `
                <div class="bg-white rounded shadow p-4">
                    <img src="${item.gambar}" class="h-40 w-full object-cover rounded mb-4">
                    <h3 class="font-bold">${item.nama}</h3>
                    <p class="text-sm text-gray-500 mb-2">${item.deskripsi}</p>
                    <div class="flex justify-between items-center">
                        <span class="text-orange-600 font-bold">Rp ${Number(item.harga).toLocaleString()}</span>
                        <span class="text-xs bg-gray-200 px-2 py-1 rounded">Stok: ${item.stok}</span>
                    </div>
                </div>
            `).join('');

            // Render Admin
            const adminDiv = document.getElementById('admin-list');
            adminDiv.innerHTML = data.map(item => `
                <tr class="border-t">
                    <td class="p-4">${item.nama}</td>
                    <td class="p-4 font-bold">${item.stok}</td>
                    <td class="p-4">
                        <button onclick="updateStok('${item.nama}', ${item.stok + 1})" class="bg-blue-500 text-white px-2 py-1 rounded">+</button>
                        <button onclick="updateStok('${item.nama}', ${item.stok - 1})" class="bg-red-500 text-white px-2 py-1 rounded">-</button>
                    </td>
                </tr>
            `).join('');
        }

        // Tambah Barang
        async function tambahBarang() {
            const body = {
                action: "add",
                nama: document.getElementById('in-nama').value,
                kategori: document.getElementById('in-kategori').value,
                harga: document.getElementById('in-harga').value,
                stok: document.getElementById('in-stok').value,
                gambar: document.getElementById('in-gambar').value,
                deskripsi: document.getElementById('in-desc').value
            };
            await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(body) });
            alert("Barang Ditambahkan!");
            muatData();
        }

        // Update Stok
        async function updateStok(nama, stokBaru) {
            const body = { action: "updateStok", nama: nama, stok: stokBaru };
            await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(body) });
            muatData();
        }

        // Inisialisasi
        muatData();
    </script>
</body>
</html>
